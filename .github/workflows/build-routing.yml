name: Gerar catálogo de roteamento (P6)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/externo-p6-precisao-roteador-20261117
    paths:
      - scripts/build_routing.py
      - .github/workflows/build-routing.yml

permissions:
  contents: write

concurrency:
  group: routing-p5-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Baixar GTFS oficial da PBH
        run: |
          curl -fSL --retry 4 --retry-delay 10 --connect-timeout 20 --max-time 180 \
            https://s3.amazonaws.com/mobilibus-uploads/gtfs/GTFSBHTRANS.zip \
            -o /tmp/GTFSBHTRANS.zip
          python -c "import zipfile; assert zipfile.is_zipfile('/tmp/GTFSBHTRANS.zip')"
      - name: Construir índice completo por trip_id
        run: |
          python scripts/build_routing.py /tmp/GTFSBHTRANS.zip catalog
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('catalog/routing-index.json').read_text(encoding='utf-8'))
          assert x['tripCount']>10000, x
          assert x['stops']>1000, x
          assert len(x['files'])>100, x
          assert x['schema']==3,x
          assert len(x['binaryFiles'])==len(x['files']),x
          assert len(x['stopIdsHash'])==64,x
          print('UBR3_BINARY_INDEX_OK',len(x['binaryFiles']),'shards')
          print('Validado:', x['tripCount'],'viagens',x['stopTimeRows'],'registros',len(x['files']),'linhas')
          PY
      - name: Verificar busca real na base recém-gerada
        run: |
          timeout 150 python - <<'PY'
          import datetime as dt
          import time
          from pathlib import Path
          from transit.planner import JourneyPlanner
          planner=JourneyPlanner(Path('catalog'))
          assert planner.ready, planner.failure
          start=time.monotonic()
          result=planner.plan({'lat':-19.8695,'lng':-43.9675},
                              {'lat':-19.918,'lng':-43.938},
                              '2026-11-18T07:00:00-03:00')
          seconds=round(time.monotonic()-start,2)
          print('ROUTING_SMOKE_TEST',result['status'],'itineraries=',len(result['itineraries']),
                'search_sec=',seconds,'stats=',result.get('stats'))
          assert result['status'] in ('ok','partial')
          PY
      - name: Publicar somente dados gerados na branch P5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/routing catalog/routing-index.json catalog/routing-stops.json catalog/routing-stop-routes.json
          if git diff --cached --quiet; then
            echo "Índice sem mudanças"
            exit 0
          fi
          git commit -m "data(routes): índice GTFS por viagem para planejamento P5"
          # Novos commits de interface não devem fazer perder o índice já calculado.
          # Tentar sempre fast-forward, sem force push ou sobrescrita de histórico.
          for attempt in $(seq 1 12); do
            git fetch origin feat/externo-p6-precisao-roteador-20261117
            git rebase origin/feat/externo-p6-precisao-roteador-20261117
            if git push origin HEAD:feat/externo-p6-precisao-roteador-20261117; then
              echo "ROUTING_DATA_PUSH_OK"
              exit 0
            fi
            sleep 3
          done
          echo "Falha ao publicar índice após 12 tentativas (sem force push)"
          exit 1
