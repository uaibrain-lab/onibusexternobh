name: P7 - Testes do roteador gratuito no navegador

on:
  push:
    branches:
      - feat/externo-p7-rotas-estaticas-gratuitas-20261117
    paths:
      - static/route-worker.js
      - static/app.js
      - tests/benchmark_static_worker.cjs
      - tests/test_static_worker.cjs
      - .github/workflows/static-routing-tests.yml
      - catalog/scan/index.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unitarios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JS
        run: |
          node --check static/route-worker.js
          node --check static/app.js
      - name: Verificar algoritmo CSA com dados GTFS sintéticos
        run: node --test tests/test_static_worker.cjs
      - name: Benchmark integral sem rede do roteador no dispositivo
        run: timeout 180 node tests/benchmark_static_worker.cjs
      - name: Validar índices estáticos publicados
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('catalog/scan/index.json')
          if not p.exists():
            print('Catálogo ainda em geração; testes sintéticos já executados.')
          else:
            data=json.loads(p.read_text(encoding='utf-8'))
            assert data['schema']==1
            assert data['tripCount']>=100000
            assert data['connectionCount']>=6000000
            print('STATIC_ROUTER_INDEX_OK',data['connectionCount'])
          PY
