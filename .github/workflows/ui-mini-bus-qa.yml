name: QA visual - miniônibus no GPS (sem deploy)

on:
  push:
    branches:
      - feat/ui-mini-bus-gps-icons-20261122
  pull_request:
    branches:
      - feat/hub-v1-municipal-package-qa-20261122

permissions:
  contents: read

jobs:
  vehicle-symbol:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe do app estático e adaptador GPS
        run: |
          node --check static/app.js
          node --check static/live-gps.js
      - name: Teste real do marcador vetorial e heading sem inventar direção
        run: node --test tests/test_gps_bus_canvas_icon.cjs
      - name: Verificar que o código de GPS da fonte não foi desligado
        run: |
          test -s static/live-gps.js
          echo "BUS_GPS_GLYPH_QA_OK"
