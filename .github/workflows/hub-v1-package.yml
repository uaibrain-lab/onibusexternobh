name: Externo BH V1 municipal - pacote estatico sem deploy

on:
  push:
    branches:
      - feat/gps-worker-free-homologacao-p15-20261117
    paths:
      - .github/workflows/hub-v1-package.yml
      - scripts/prepare_hub_v1.py
      - scripts/rebuild_hub_v1_catalog.py
      - scripts/probe_hub_v1_gps.py
      - scripts/build_static_site.py
      - scripts/build_static_arrivals.py
      - tests/test_hub_v1_gps_probe.py
      - static/**
      - catalog/**
  pull_request:
    branches:
      - feat/integracao-final-exclusiva-onibus-20261117
    paths:
      - .github/workflows/hub-v1-package.yml
      - scripts/prepare_hub_v1.py
      - scripts/rebuild_hub_v1_catalog.py
      - scripts/probe_hub_v1_gps.py
      - scripts/build_static_site.py
      - static/**
      - catalog/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-v1-canonical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  municipal-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilacao Python e regressao GPS (sem exigir feed ao vivo)
        run: |
          python -m compileall -q scripts/prepare_hub_v1.py scripts/rebuild_hub_v1_catalog.py scripts/probe_hub_v1_gps.py
          node --check static/app.js
          node --check static/service-worker.js
          python -m unittest discover -s tests -p 'test_hub_v1_gps_probe.py' -q
          node --test tests/test_gtfs_realtime_worker.cjs tests/test_gtfs_realtime_adapter.cjs tests/test_live_gps_adapter.cjs
      - name: Verificar ZIP oficial e renovar catalogo somente no workspace
        run: |
          curl --fail --location --retry 3 --retry-delay 8 \
            --connect-timeout 20 --max-time 240 \
            https://s3.amazonaws.com/mobilibus-uploads/gtfs/GTFSBHTRANS.zip \
            -o /tmp/GTFSBHTRANS.zip
          python scripts/check_official_gtfs.py /tmp/GTFSBHTRANS.zip catalog/source-gtfs.sha256
          python -m scripts.rebuild_hub_v1_catalog /tmp/GTFSBHTRANS.zip catalog
      - name: Build municipal com GPS desligado por padrao
        run: |
          python scripts/build_static_site.py --output dist --hub-v1
          python scripts/prepare_hub_v1.py dist/externo
          test ! -e dist/externo/catalog/scan/index.json
          test ! -e dist/externo/catalog/der-rmbh-411c-511c.json
          test -s dist/externo/catalog/arrivals/ff.json.gz
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('dist/externo')
          config=json.loads((root/'gps-config.json').read_text(encoding='utf-8'))
          build=json.loads((root/'hub-v1-build.json').read_text(encoding='utf-8'))
          assert config['enabled'] is False and build['gpsEnabled'] is False
          assert build['routingEnabled'] is False and build['metropolitanEnabled'] is False
          assert build['status']=='staged-not-approved'
          print('HUB_V1_SCHEDULED_ONLY_STAGED_OK')
          PY
      - name: Smoke HTTP local (sem deploy)
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/hub-v1-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 2
          curl -fsS http://127.0.0.1:8765/externo/ | grep -q 'data-app-mode="free-static"'
          curl -fsS http://127.0.0.1:8765/externo/catalog/arrivals/index.json >/dev/null
          curl -fsS http://127.0.0.1:8765/externo/catalog/metro.json >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/externo/catalog/scan/index.json)" = "404"
          echo HUB_V1_HTTP_OK
      - name: Publicar somente artefato privado de homologacao
        uses: actions/upload-artifact@v4
        with:
          name: externo-bh-v1-municipal-staged-no-deploy
          path: dist/externo/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
