name: Externo BH V1 - pacote municipal para Hub (sem deploy)

on:
  push:
    branches:
      - feat/hub-v1-municipal-package-qa-20261122
      - feat/hub-v1-gps-minibus-package-20261122
    paths:
      - .github/workflows/hub-v1-package.yml
      - scripts/prepare_hub_v1.py
      - scripts/rebuild_hub_v1_catalog.py
      - scripts/probe_hub_v1_gps.py
      - tests/test_hub_v1_gps_probe.py
      - tests/test_gps_bus_canvas_icon.cjs
      - scripts/build_static_site.py
      - scripts/build_static_arrivals.py
      - static/**
      - catalog/**
      - data_quality/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-v1-municipal-branch
  cancel-in-progress: true

jobs:
  build-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes V1 (somente municipal)
        run: |
          python -m compileall -q data_quality scripts/prepare_hub_v1.py scripts/rebuild_hub_v1_catalog.py scripts/probe_hub_v1_gps.py
          python -m unittest discover -s tests -p test_hub_v1_gps_probe.py -q
          node --check static/app.js
          node --test tests/test_gps_bus_canvas_icon.cjs
          node --test tests/test_gtfs_realtime_worker.cjs tests/test_gtfs_realtime_adapter.cjs tests/test_live_gps_adapter.cjs
          python -m unittest -q \
            data_quality.test_bh_v1_release_gate \
            data_quality.test_bh_v1_patterns \
            data_quality.test_bh_v1_freshness \
            data_quality.test_static_arrivals_reference \
            data_quality.test_bh_v1_source_provenance \
            data_quality.test_bh_v1_timetable_consistency \
            data_quality.test_bh_v1_zip_timetable_equivalence \
            data_quality.test_bh_v1_trip_sequence
      - name: Baixar e reconstruir GTFS oficial só no ambiente temporário
        run: |
          curl --fail --location --retry 3 --retry-delay 8 \
            --connect-timeout 20 --max-time 240 \
            https://s3.amazonaws.com/mobilibus-uploads/gtfs/GTFSBHTRANS.zip \
            -o /tmp/GTFSBHTRANS.zip
          python scripts/check_official_gtfs.py /tmp/GTFSBHTRANS.zip catalog/source-gtfs.sha256
          python -m scripts.rebuild_hub_v1_catalog /tmp/GTFSBHTRANS.zip catalog
      - name: Verificar GPS SUMOB ao vivo (posição recente e CORS do Hub)
        run: |
          python -m scripts.probe_hub_v1_gps catalog /tmp/hub-v1-gps-proof.json
      - name: Build imutável e redução V1 (sem rotas e RMBH, GPS mantido)
        run: |
          python scripts/build_static_site.py --output dist --hub-v1
          python scripts/prepare_hub_v1.py dist/externo
          test ! -e dist/externo/catalog/scan/index.json
          test ! -e dist/externo/catalog/der-rmbh-411c-511c.json
          test -s dist/externo/catalog/arrivals/ff.json.gz
      - name: Verificar ZIP original, variantes e cada horário publicado
        run: |
          python -m data_quality.bh_v1_release_gate catalog \
            --date "$(date -u +%Y%m%d)" --require-patterns \
            --require-arrivals --arrivals-index dist/externo/catalog/arrivals/index.json \
            --require-source-zip --source-zip /tmp/GTFSBHTRANS.zip
      - name: Registrar GTFS e GPS validados dentro do artefato (não é assinatura digital)
        run: |
          python - <<'PY'
          import datetime
          import hashlib
          import json
          from pathlib import Path
          from zoneinfo import ZoneInfo
          root=Path('dist/externo')
          cat=root/'catalog'
          manifest=json.loads((cat/'manifest.json').read_text(encoding='utf8'))
          index=json.loads((cat/'arrivals/index.json').read_text(encoding='utf8'))
          build=json.loads((root/'hub-v1-build.json').read_text(encoding='utf8'))
          gps=json.loads((root/'gps-config.json').read_text(encoding='utf8'))
          proof=json.loads(Path('/tmp/hub-v1-gps-proof.json').read_text(encoding='utf8'))
          z=Path('/tmp/GTFSBHTRANS.zip')
          h=hashlib.sha256()
          with z.open('rb') as stream:
              for block in iter(lambda:stream.read(1024*1024),b''):h.update(block)
          recorded=Path('catalog/source-gtfs.sha256').read_text(encoding='ascii').strip()
          assert h.hexdigest()==recorded
          assert gps['enabled'] is True and gps['provider']=='gtfs_rt'
          assert build['gpsEnabled'] is True and proof['probePassed'] is True
          assert manifest['gtfsVersion']==build['gtfsVersion']==index['version']
          assert manifest['feedEndDate']==build['validThrough']==index['validThrough']
          qa={
            'schema':1,'status':'passed','scope':'municipal-bh-and-metro',
            'sourceSha256':recorded,
            'validatedServiceDate':datetime.datetime.now(
                ZoneInfo('America/Sao_Paulo')).strftime('%Y%m%d'),
            'gtfsVersion':manifest['gtfsVersion'],
            'validThrough':manifest['feedEndDate'],
            'routes':manifest['routes'],
            'scheduledStops':index['stopCount'],'shards':256,
            'routingEnabled':False,'metropolitanEnabled':False,'gpsEnabled':True,
            'gpsProvider':'gtfs_rt','gpsProbePassed':True,
            'gpsProbeCheckedAtUtc':proof['checkedAtUtc'],
            'gpsRecentPositionsObserved':proof['recentPositions'],
            'mapVehicleMarker':'mini-bus-canvas',
            'attestation':'CI gate passed; not cryptographically signed; no deployment'
          }
          (root/'hub-v1-qa.json').write_text(
              json.dumps(qa,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          print('HUB_V1_QA_ATTESTATION_STAGED',qa['sourceSha256'],qa['gtfsVersion'])
          PY
      - name: Smoke HTTP local (não publica)
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/hub-v1-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 2
          curl -fsS http://127.0.0.1:8765/externo/ | grep -q 'data-app-mode="free-static"'
          curl -fsS http://127.0.0.1:8765/externo/catalog/arrivals/index.json >/dev/null
          curl -fsS http://127.0.0.1:8765/externo/catalog/metro.json >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/externo/catalog/scan/index.json)" = "404"
          echo HUB_V1_HTTP_OK
      - name: Publicar apenas artefato de homologação (não faz deploy)
        uses: actions/upload-artifact@v4
        with:
          name: externo-hub-v1-gps-mini-onibus
          path: dist/externo/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
