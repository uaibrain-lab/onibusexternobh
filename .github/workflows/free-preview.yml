name: P9 - Preview hospedável sem cobrança

on:
  workflow_dispatch:
  push:
    branches:
      - feat/externo-p9-multimodal-gratuito-20261117
    paths:
      - scripts/build_static_site.py
      - .github/workflows/free-preview.yml
      - scripts/build_static_scan.py
      - static/static-bus.js
      - tests/test_static_bus.cjs
      - static/app.js
      - static/service-worker.js
      - catalog/scan/index.json

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testes do motor
        run: |
          node --check static/route-worker.js
          node --check static/service-worker.js
          node --check static/app.js
          node --check static/static-bus.js
          node --check static/walk-network.js
          node --check static/metro-timing.js
          node --test tests/test_static_worker.cjs tests/test_static_bus.cjs tests/test_walk_network.cjs tests/test_metro_timing.cjs
      - name: Empacotar preview puramente estático
        run: |
          python scripts/build_static_site.py
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('dist')
          data=json.loads((root/'firebase.json').read_text(encoding='utf-8'))
          assert data['hosting']['public']=='.'
          html=(root/'externo/index.html').read_text(encoding='utf-8')
          assert 'data-app-mode="free-static"' in html
          assert (root/'externo/route-worker.js').is_file()
          assert (root/'externo/static-bus.js').is_file()
          assert (root/'externo/walk-network.js').is_file()
          assert (root/'externo/metro-timing.js').is_file()
          assert 'static-bus.js' in html
          assert (root/'externo/catalog/routes.json').is_file()
          assert (root/'externo/catalog/stops.json').is_file()
          assert (root/'externo/catalog/patterns.json').is_file()
          assert (root/'externo/service-worker.js').is_file()
          assert (root/'externo/catalog/metro.json').is_file()
          assert (root/'externo/catalog/scan/index.json').is_file()
          assert any((root/'externo/catalog/scan/out').rglob('08.bin.gz'))
          print('FREE_SITE_PACKAGE_OK')
          PY
      - name: Smoke-test HTTP de arquivos públicos
        run: |
          python -m http.server 8765 --directory dist >/tmp/p7-http.log 2>&1 &
          export HTTP_PID=$!
          trap 'kill "$HTTP_PID" 2>/dev/null || true' EXIT
          sleep 2
          curl -fsS http://127.0.0.1:8765/externo/ | grep -q 'data-app-mode="free-static"'
          curl -fsS http://127.0.0.1:8765/externo/catalog/scan/index.json >/dev/null
          curl -fsS http://127.0.0.1:8765/externo/route-worker.js >/dev/null
          echo "FREE_STATIC_HTTP_OK"
      - name: Disponibilizar preview para homologação (não publica)
        uses: actions/upload-artifact@v4
        with:
          name: externo-p7-estatico-homologacao
          path: dist/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
