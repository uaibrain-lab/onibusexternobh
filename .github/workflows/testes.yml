name: Testes P2

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unitarios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Testes unitários de ônibus e metrô
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q server.py transit tests
      - name: Validar sintaxe JavaScript
        run: node --check static/app.js
      - name: Validar catálogo de metrô
        run: |
          python - <<'PY'
          from pathlib import Path
          from transit.metro import MetroCatalog
          m=MetroCatalog(Path('catalog'))
          assert len(m.data['stations']) == 22
          assert len(m.line('2')['stations']) == 2
          assert m.stations['nova-suica']['interchange']
          print('Catálogo do metrô coerente')
          PY
