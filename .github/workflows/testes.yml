name: Testes P2

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unitarios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Testes offline (após importação da P2)
        run: |
          if [ -f server.py ] && [ -d tests ]; then
            python -m unittest discover -s tests -v
            python -m compileall -q server.py transit tests
          else
            echo "Aguardando importação do código P2; repositório ainda em preparação."
          fi

      - name: Validar JavaScript
        run: node --check static/app.js
