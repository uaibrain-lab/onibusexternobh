# Independent, opt-in Workers Free candidate for PBH GPS.
# No account secret, KV, D1, cron, paid service, or changes to Hub Worker.
name = "externo-bh-gps-free"
main = "src/index.mjs"
compatibility_date = "2026-11-17"
workers_dev = true

# GPS is disabled by default in static/gps-config.json.
# Deploy/enable only after confirming origin access and free usage.

# Isolated Worker for verifying ETA/alerts with live upstream feeds.
# Never reuse the production hostname or deploy it implicitly.
[env.eta-qa]
name = "externo-bh-gps-eta-qa"
workers_dev = true
